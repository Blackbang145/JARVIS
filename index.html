<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Dashboard</title>

    <!-- Icône de l'application -->
    <link rel="icon" type="image/jpeg" href="jarvis2.jpeg">
    <link rel="apple-touch-icon" href="jarvis2.jpeg">
    <meta name="theme-color" content="#050b14">

    <!-- Fichier CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-standard">

    <div class="dashboard-container">
        <!-- HEADER : Stats Systèmes -->
        <header class="hud-header">
            <div class="hud-box">
                <span class="hud-label">HORLOGE</span>
                <span id="clockVal" class="hud-value">--:--:--</span>
            </div>

            <!-- BOUTON MIS À JOUR -->
            <button id="bleBtn" class="hud-btn" onclick="connectBluetoothWinzwon()">
                ÉTABLIR LA CONNEXION BLE ⚡
            </button>

            <div class="hud-box">
                <span class="hud-label">BATTERIE</span>
                <span id="batteryVal" class="hud-value">--%</span>
                <div class="battery-bar-container">
                    <div id="batteryBar" class="battery-bar"></div>
                </div>
                <span id="batteryStatus" class="hud-subtext">SUR BATTERIE</span>
            </div>
        </header>

        <!-- CENTRE : RÉACTEUR ARC STARK DE NOUVELLE GÉNÉRATION -->
        <main class="hud-main">
            <div class="arc-container">
                <div class="arc-reactor">
                    <div class="outer-ring"></div>
                    <div class="tech-ring"></div>
                    <div class="inner-ring"></div>
                    <div class="segment-ring"></div>
                    <div class="core-glow"></div>
                </div>
            </div>

            <div class="speech-hud">
                <p id="speechText">SYSTÈME J.A.R.V.I.S. PRÊT AU COMMANDE</p>
            </div>
        </main>

        <!-- FOOTER : Indicateurs de Conduite -->
        <footer class="hud-footer">
            <div class="hud-box">
                <span class="hud-label">VITESSE GPS</span>
                <div class="speed-display">
                    <span id="speedVal" class="hud-value-large">0</span>
                    <span class="unit">KM/H</span>
                </div>
                <span id="headingVal" class="hud-subtext">N (0°)</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">MODE ACTIF</span>
                <span id="modeDisplay" class="hud-value-highlight">STD</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">MÉTÉO</span>
                <span id="tempVal" class="hud-value">--°C</span>
                <span id="weatherDesc" class="hud-subtext">RECHERCHE...</span>
            </div>
        </footer>
    </div>

    <!-- Script JavaScript principal -->
    <script src="app.js"></script>
</body>
</html>
