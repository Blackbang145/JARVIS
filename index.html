<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Tactical Dashboard</title>

    <!-- Manifeste PWA & Meta Tags Mobile -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S.">

    <link rel="icon" type="image/jpeg" href="jarvis2.jpeg">
    <link rel="apple-touch-icon" href="jarvis2.jpeg">
    <meta name="theme-color" content="#00f3ff">

    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-standard">

    <div class="dashboard-container">
        <!-- HEADER : Stats Systèmes -->
        <header class="hud-header">
            <div class="hud-box">
                <span class="hud-label">HORLOGE SYSTÈME</span>
                <span id="clockVal" class="hud-value">--:--:--</span>
            </div>

            <button id="bleBtn" class="hud-btn" onclick="connectBluetoothWinzwon()">
                ÉTABLIR LIAISON BLE ⚡
            </button>

            <div class="hud-box">
                <span class="hud-label">ALIMENTATION</span>
                <span id="batteryVal" class="hud-value">--%</span>
                <div class="battery-bar-container">
                    <div id="batteryBar" class="battery-bar"></div>
                </div>
                <span id="batteryStatus" class="hud-subtext">SUR BATTERIE</span>
            </div>
        </header>

        <!-- CENTRE : RÉACTEUR ARC & COMMANDES TACTILES -->
        <main class="hud-main">
            <div class="arc-container" id="arcBtn" onclick="triggerJarvisGreeting()" style="cursor: pointer;">
                <div class="arc-reactor">
                    <div class="outer-ring"></div>
                    <div class="tech-ring"></div>
                    <div class="inner-ring"></div>
                    <div class="segment-ring"></div>
                    <div class="core-glow"></div>
                </div>
            </div>

            <div class="speech-hud">
                <p id="speechText">COMMANDES TACTILES PRÊTES</p>
            </div>

            <!-- PANNEAU DE COMMANDES 100% TACTILE -->
            <div class="control-panel">
                <button class="control-btn btn-chill" onclick="setMode('chill')">CHILL MODE</button>
                <button class="control-btn btn-switch" onclick="toggleSwitchMode()">SWITCH (STD/OVER)</button>
                <button class="control-btn btn-alert" onclick="setMode('alert')">ALERTE</button>
                <button class="control-btn btn-music" onclick="playMusicControl()">MUSIQUE 🎵</button>
                <button class="control-btn btn-info control-btn-full" onclick="speakStatusReport()">RAPPORT SYSTÈME 📊</button>
            </div>
        </main>

        <!-- FOOTER : Télémétrie -->
        <footer class="hud-footer">
            <div class="hud-box">
                <span class="hud-label">VITESSE GPS</span>
                <div class="speed-display">
                    <span id="speedVal" class="hud-value-large">0</span>
                    <span class="unit">KM/H</span>
                </div>
                <span id="headingVal" class="hud-subtext">CAP 0°</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">MODE ACTIF</span>
                <span id="modeDisplay" class="hud-value-highlight">STD</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">CONDITIONS MÉTÉO</span>
                <span id="tempVal" class="hud-value">--°C</span>
                <span id="weatherDesc" class="hud-subtext">ACQUISITION...</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker J.A.R.V.I.S. actif'))
                    .catch(err => console.log('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
